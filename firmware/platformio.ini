[platformio]
default_envs = genericCH32X035F7P6

[env:genericCH32X035F7P6]
platform = ch32v
board = genericCH32X035F7P6
# framework = ch32v003fun  <-- コメントアウト
; USB upload without WCH-LinkE (#54): 0xF0 -> BootROM -> wchisp, see uploader/.
; To flash a board that is already in the bootloader (JP1 shorted) the same
; command works: the uploader falls back to wchisp directly.
upload_protocol = custom
extra_scripts = pre:fscb_upload.py

build_flags =
    -Isrc
    -Ilib/Drivers/inc
    -nostartfiles
    -Wl,-T"lib/EVT/EXAM/SRC/Ld/Link.ld"
    -DCH32X035

build_src_filter =
    +<*>
    +<../lib/Drivers/src/*.c>
    +<../lib/Drivers/src/*.S>
